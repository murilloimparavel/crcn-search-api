services:
  crcn-search-api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SCRAPER_NAVIGATION_TIMEOUT_MS=18000
      - SCRAPER_RENDER_TIMEOUT_MS=8000
      - CORS_ORIGINS=https://crm.murilloalves.com.br
