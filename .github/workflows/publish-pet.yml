name: Publish isolated pet correction
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npm test && npm audit --omit=dev
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/murilloimparavel/crcn-search-api-deploy:sha-${{ github.event.pull_request.head.sha }}
